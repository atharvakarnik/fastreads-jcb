<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastReads JCB</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <aside id="left">
      <div class="label">Subject</div>
      <div class="subjectMeta">
        <div class="chip">ID: <span id="sid" class="mono">------</span></div>
        <div class="chip">Index: <span id="sidx" class="mono">-</span>/<span id="scount" class="mono">-</span></div>
      </div>

      <div class="row">
        <button id="prevBtn" type="button">Prev</button>
        <button id="nextBtn" type="button">Next</button>
      </div>

      <div class="label">Go to ID</div>
      <div class="row">
        <input id="gotoInput" class="mono" type="text" placeholder="Loading IDs..." />
        <button id="goBtn" type="button">Go</button>
      </div>

      <div class="label">Go to index (1-<span id="gotoIndexMax">?</span>)</div>
      <div class="row">
        <input id="gotoIndexInput" class="mono" type="text" inputmode="numeric" placeholder="Loading index..." />
        <button id="goIndexBtn" type="button">Go</button>
      </div>

      <div class="hr"></div>

      <section id="overlayControls" class="overlayControls" hidden>
        <div class="label">Overlay display</div>
        <label class="checkRow">
          <input id="overlayVisible" type="checkbox" checked />
          Show overlay
        </label>
        <label class="sliderField">
          <span>Opacity</span>
          <input id="overlayOpacity" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
        <div class="status">Value: <span id="overlayOpacityValue" class="mono">1.00</span></div>
      </section>

      <div id="overlayControlsHr" class="hr" hidden></div>

      <section id="displayControls" class="displayControls" hidden>
        <div class="label">Image display</div>
        <label class="displaySourceField">
          <span>Source</span>
          <select id="displaySource"></select>
        </label>
        <div class="rangeGrid">
          <label class="rangeField">
            <span>Min</span>
            <input id="displayRangeMin" class="mono" type="number" step="any" inputmode="decimal" />
          </label>
          <label class="rangeField">
            <span>Max</span>
            <input id="displayRangeMax" class="mono" type="number" step="any" inputmode="decimal" />
          </label>
          <button id="displayRangeReset" class="smallBtn" type="button">Auto</button>
        </div>
        <label class="sliderField">
          <span>Window</span>
          <div class="sliderRow">
            <input id="displayWindowSlider" type="range" step="any" />
            <input id="displayWindowInput" class="mono" type="number" step="any" inputmode="decimal" />
          </div>
        </label>
        <label class="sliderField">
          <span>Level</span>
          <div class="sliderRow">
            <input id="displayLevelSlider" type="range" step="any" />
            <input id="displayLevelInput" class="mono" type="number" step="any" inputmode="decimal" />
          </div>
        </label>
      </section>

      <div id="displayControlsHr" class="hr" hidden></div>

      <section id="pdfControls" class="pdfControls" hidden>
        <div class="label">PDF display</div>
        <label class="sliderField">
          <span>Zoom</span>
          <div class="sliderRow">
            <input id="pdfZoomSlider" type="range" min="0.5" max="2.5" step="0.05" value="1" />
            <input id="pdfZoomInput" class="mono" type="number" min="50" max="250" step="5" value="100" inputmode="numeric" />
          </div>
        </label>
        <div class="row compactRow">
          <button id="pdfFitWidthBtn" class="smallBtn" type="button">Fit Width</button>
          <button id="pdfActualSizeBtn" class="smallBtn" type="button">100%</button>
        </div>
      </section>

      <div id="pdfControlsHr" class="hr" hidden></div>

      <div class="label">Review</div>
      <div class="reviewGrid">
        <label class="reviewField">
          <span>Case</span>
          <select id="caseStatus">
            <option value="">Unset</option>
            <option value="Positive">Positive</option>
            <option value="Negative">Negative</option>
            <option value="Borderline">Borderline</option>
          </select>
        </label>
        <label class="checkRow">
          <input id="flagForReview" type="checkbox" />
          Flag for review
        </label>
        <label class="checkRow">
          <input id="needsProcessingQc" type="checkbox" />
          Needs processing QC
        </label>
      </div>

      <div class="label notesLabel">Notes</div>
      <textarea id="notes" placeholder="Type notes here..."></textarea>

      <div class="row">
        <button id="saveBtn" type="button">Save Review</button>
        <button id="clearBtn" type="button">Clear This</button>
      </div>

      <div id="status" class="status"></div>
    </aside>

    <main id="viewerWrap">
      <div id="topBar">
        <div id="tabs" class="tabs" aria-label="Views"></div>
        <div class="toolGroup" aria-label="Slice tools">
          <button id="sliceToolNavigate" class="toolBtn isActive" type="button" title="Navigate slices">
            <span>Navigate</span>
          </button>
          <button id="sliceToolZoom" class="toolBtn" type="button" title="Drag to zoom the active pane">
            <span>Zoom</span>
          </button>
          <button id="sliceToolReset" class="toolBtn" type="button" title="Click a pane to reset zoom">
            <span>Reset Zoom</span>
          </button>
          <button id="crosshairToggle" class="toolBtn isActive" type="button" title="Show or hide crosshairs" aria-pressed="true">
            <span>Crosshair</span>
          </button>
        </div>
        <div id="topStatus" class="status"></div>
      </div>
      <div id="gl">
        <canvas id="niivueCanvas" class="viewerCanvas"></canvas>
        <canvas id="toolOverlay" class="toolOverlay"></canvas>
        <iframe id="pdfFrame" title="Subject report PDF"></iframe>
        <div id="pdfPages" class="pdfPages" aria-label="PDF pages"></div>
        <div id="emptyState" class="emptyState">No view loaded.</div>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
